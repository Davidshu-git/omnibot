services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_obs}
      POSTGRES_USER: ${POSTGRES_USER:-agent_obs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_obs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_obs}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-agent_obs}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MHXY_LOG_DIR: /logs/mhxy/sessions
      MHXY_EXECUTOR_LOG_DIR: /logs/omnibot/mhxy-executor
      MHXY_EXECUTOR_STATUS_FILE: /logs/omnibot/mhxy/executor_status.json
      OMNIBOT_STOCK_LOG_DIR: /logs/omnibot/stock/sessions
      OMNIBOT_EHS_LOG_DIR: /logs/omnibot/ehs/sessions
      RUNTIME_DIR_MHXY: /runtime/mhxy
      RUNTIME_DIR_STOCK_BOT: /runtime/stock-bot
      RUNTIME_DIR_EHS_BOT: /runtime/ehs-bot
      OBS_BOT_CHAT_TOKEN: ${OBS_BOT_CHAT_TOKEN:-}
      STOCK_BOT_CHAT_URL: ${STOCK_BOT_CHAT_URL:-http://192.168.1.100:8810}
      EHS_BOT_CHAT_URL: ${EHS_BOT_CHAT_URL:-http://192.168.1.100:8811}
      MHXY_BOT_CHAT_URL: ${MHXY_BOT_CHAT_URL:-http://192.168.1.100:8812}
    volumes:
      - ./api:/app
      - ${MHXY_HOST_LOG_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/mhxy/observability/sessions}:/logs/mhxy/sessions:ro
      - ${OMNIBOT_MHXY_LOG_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/logs/mhxy}:/logs/omnibot/mhxy:ro
      - ${OMNIBOT_MHXY_EXECUTOR_LOG_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/mhxy/observability/executor}:/logs/omnibot/mhxy-executor:ro
      - ${OMNIBOT_STOCK_HOST_LOG_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/stock/observability/sessions}:/logs/omnibot/stock/sessions:ro
      - ${OMNIBOT_EHS_HOST_LOG_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/ehs/observability/sessions}:/logs/omnibot/ehs/sessions:ro
      - ${MHXY_HOST_DATA_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/mhxy}:/runtime/mhxy:ro
      - ${OMNIBOT_STOCK_HOST_DATA_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/stock}:/runtime/stock-bot:ro
      - ${OMNIBOT_EHS_HOST_DATA_DIR:-/volume1/server/.openclaw/workspace/projects/omnibot/data/ehs}:/runtime/ehs-bot:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  # TLS 网关：给 obs/web 提供统一 https 入口，解决 WebCodecs 要求 Secure Context。
  # 老入口 web:3100 / api:8000 保持不动，本服务为并行新增，零回归。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8444:8444"
    environment:
      OBS_TLS_HOST: ${OBS_TLS_HOST:-192.168.1.100}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
    external: true
    name: agent-observability_postgres_data
  caddy_data:
  caddy_config:
